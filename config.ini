; 학습.pdf ToDo - YOLO 학습 설정 (config.ini)
; 이 파일을 config.ini로 복사 후 경로를 수정하여 사용

[Model]
; 사용할 모델 가중치 (yolo11l = 11 시리즈 large). 사용법은 README "모델 가중치 사용법" 참고
weight = yolo26l.pt

[Data]
; 데이터셋 yaml 파일의 절대 경로 또는 상대 경로
yaml_path = datasets/yolo/data.yaml

[Training]
epochs = 100
imgsz = 640
batch = 16
patience = 50
rect = yes

[System]
device = 0
workers = 8

[Output]
; 아웃풋 저장 경로 (weights, metrics.txt, val_vis 모두 이 경로 아래에 저장)
output_dir = /home/pmj0324/isplab/Flare_YOLO/yolo_26l
